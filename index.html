<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>취재 도구함 · 열람 페이지로 이동</title>
  <meta http-equiv="refresh" content="0;url=./view.html">
</head>
<body>
  <p>취재 도구함 열람 페이지로 이동합니다. <a href="./view.html">열람 페이지 열기</a></p>
  <script>
    // Old GitHub Pages origin must no longer retain the legacy GitHub PAT.
    try { localStorage.removeItem('reporter-toolkit-github-remember-v1'); } catch {}
    const target = new URL('./view.html', location.href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</body>
</html>
