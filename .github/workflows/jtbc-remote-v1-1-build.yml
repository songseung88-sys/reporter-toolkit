name: Build JTBC Remote Access v1.1
on:
  push:
    branches:
      - build-jtbc-v1-1-final-20261013

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Recreate final AHK source
        shell: pwsh
        run: |
          $b64 = @'
          
          '@
          $compressed = [Convert]::FromBase64String(($b64 -replace '\s',''))
          $input = [IO.MemoryStream]::new(,$compressed)
          $gzip = [IO.Compression.GzipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          $output = [IO.MemoryStream]::new()
          $gzip.CopyTo($output)
          $gzip.Dispose()
          $input.Dispose()
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\JTBC_Remote_Access_v1.1.ahk",$output.ToArray())
          $output.Dispose()

      - name: Download official AutoHotkey v2
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "JTBC-Remote-Access-Build" }
          $release = Invoke-RestMethod -Headers $headers https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match '^AutoHotkey_2.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "AutoHotkey v2 ZIP asset not found" }
          Invoke-WebRequest -Headers $headers $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\autohotkey.zip"
          Expand-Archive "$env:RUNNER_TEMP\autohotkey.zip" "$env:RUNNER_TEMP\autohotkey"

      - name: Download official Ahk2Exe
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "JTBC-Remote-Access-Build" }
          $release = Invoke-RestMethod -Headers $headers https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Ahk2Exe ZIP asset not found" }
          Invoke-WebRequest -Headers $headers $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\ahk2exe.zip"
          Expand-Archive "$env:RUNNER_TEMP\ahk2exe.zip" "$env:RUNNER_TEMP\ahk2exe"

      - name: Compile with official Ahk2Exe
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "$env:RUNNER_TEMP\ahk2exe" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1
          $base = Get-ChildItem "$env:RUNNER_TEMP\autohotkey" -Recurse -Filter "AutoHotkey64.exe" | Select-Object -First 1
          if (-not $compiler) { throw "Ahk2Exe.exe not found" }
          if (-not $base) { throw "AutoHotkey64.exe not found" }
          & $compiler.FullName /in "$env:GITHUB_WORKSPACE\JTBC_Remote_Access_v1.1.ahk" /out "$env:GITHUB_WORKSPACE\JTBC_Remote_Access_v1.1.exe" /base $base.FullName
          if ($LASTEXITCODE -ne 0) { throw "Ahk2Exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\JTBC_Remote_Access_v1.1.exe")) { throw "Output EXE not created" }

      - name: Show SHA-256
        shell: pwsh
        run: |
          Get-FileHash "$env:GITHUB_WORKSPACE\JTBC_Remote_Access_v1.1.exe" -Algorithm SHA256

      - name: Upload compiled EXE
        uses: actions/upload-artifact@v4
        with:
          name: JTBC_Remote_Access_v1.1
          path: JTBC_Remote_Access_v1.1.exe
          if-no-files-found: error
          retention-days: 1
